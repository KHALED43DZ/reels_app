<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صانع موارد الريلز</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <div class="container">
    <h2>🎬 صانع موارد مسلسلات الريلز</h2>
    <p class="subtitle">قم بإنتاج السكريبت، الصور، والأصوات وحملها في ملف ZIP بضغطة زر.</p>

    <div class="form-group">
      <label for="apiKey">مفتاح Gemini API:</label>
      <input type="password" id="apiKey" placeholder="أدخل مفتاح AI الخاص بك هنا">
    </div>

    <div class="form-group">
      <label for="genre">نوع المسلسل:</label>
      <select id="genre">
        <option value="تاريخي ودراما/ألف ليلة وليلة">تاريخي ودراما / ألف ليلة وليلة</option>
        <option value="حكم وقصص/كليلة ودمنة">حكم وقصص / كليلة ودمنة</option>
        <option value="غموض وإثارة">غموض وإثارة</option>
        <option value="رعب وخيال مظلم">رعب وخيال مظلم</option>
      </select>
    </div>

    <div class="form-group">
      <label for="scenesCount">عدد المشاهد:</label>
      <input type="number" id="scenesCount" min="2" max="6" value="3">
    </div>

    <div class="form-group">
      <label for="storyIdea">فكرة المسلسل:</label>
      <textarea id="storyIdea" rows="3" placeholder="أدخل فكرة القصة هنا..."></textarea>
    </div>

    <button id="generateBtn" onclick="generateAssets()">🚀 بدء إنتاج حزمة الموارد</button>

    <div id="status" class="status"></div>
    <div id="preview" class="preview-container"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
